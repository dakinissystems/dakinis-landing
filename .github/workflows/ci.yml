name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@dakinissystems"

      - name: Install from GitHub Packages + build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci || install_rc=$?
          else
            npm install || install_rc=$?
          fi
          if [ "${install_rc:-0}" -ne 0 ]; then
            echo "::error::npm install failed (often 403 read_package)."
            echo "Grant Actions read on @dakinissystems/shared-brand to this repo:"
            echo "  GitHub → Packages → shared-brand → Package settings → Manage Actions access → add dakinis-landing (Read)"
            echo "Or set repo secret NODE_AUTH_TOKEN to a PAT with read:packages."
            exit "${install_rc}"
          fi
          npm run build
